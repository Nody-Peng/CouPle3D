services:
  - type: web
    name: together-home-2d
    runtime: node
    branch: asset-2d-rebuild
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: couple-save
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: COUPLE_DATA_FILE
        value: /var/data/state.json
      - key: COUPLE_TEST_CODE
        sync: false
