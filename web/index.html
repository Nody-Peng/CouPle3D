<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" href="/game/index.icon.png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#47766e"><title>兩個人的座標</title>
<link rel="stylesheet" href="/home2d.css"><script src="/home2d.js" defer></script>
</head>
<body><main>
<img class="town" src="/town-preview.png" alt="兩人的海港小鎮">
<iframe id="game" title="兩個人的座標：2D 家園" allow="fullscreen; autoplay" hidden></iframe>
<section id="login" aria-labelledby="title">
<h1 id="title">兩個人的座標</h1>
<form id="login-form">
<fieldset><legend>你的角色</legend>
<label><input type="radio" name="identity" value="a" checked> 第一位玩家</label>
<label><input type="radio" name="identity" value="b"> 第二位玩家</label>
</fieldset>
<label for="code">私人通行碼</label>
<input id="code" type="password" autocomplete="current-password" required maxlength="256">
<button id="enter" type="submit">回到共同之家</button><p id="error" role="alert"></p>
</form></section><button id="logout" type="button" hidden>登出</button>
</main></body></html>
